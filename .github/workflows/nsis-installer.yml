name: Build WinForms App & NSIS Installer

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ github.ref_name }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    - name: Restore NuGet Packages
      run: nuget restore ConBrioMusica.sln

    - name: Build Application
      run: msbuild ConBrioMusica.sln /p:Configuration=Release /p:Platform="Any CPU"

    - name: Install NSIS
      uses: negrutiu/nsis-install@v2
      with:
        version: '3.10'

    - name: Compile NSIS Installer
      run: |
        makensis installer.nsi
        Move-Item -Path "ConBrioMusica-Setup.exe" -Destination "ConBrioMusica-Setup-${{ github.ref_name }}.exe"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConBrioMusica-Installer-${{ github.ref_name }}
        path: ConBrioMusica-Setup-${{ github.ref_name }}.exe

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Built Installer Artifact
      uses: actions/download-artifact@v4
      with:
        name: ConBrioMusica-Installer-${{ needs.build.outputs.tag_name }}
        path: ./artifacts

     Tar-gz or binary asset allocation to GitHub Release
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.build.outputs.tag_name }}" \
          ./artifacts/ConBrioMusica-Setup-${{ needs.build.outputs.tag_name }}.exe \
          --title "Release ${{ needs.build.outputs.tag_name }}" \
          --generate-notes
